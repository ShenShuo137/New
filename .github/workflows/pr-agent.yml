name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装 PR Agent
      run: pip install pr-agent
      
    - name: 运行 PR Agent
      env:
        # ✅ 根据官方文档：OpenAI 兼容 API 使用 api_key
        OPENAI__API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        # ✅ GitHub Token
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review