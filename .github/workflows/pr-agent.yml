name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装 PR Agent
      run: pip install pr-agent
      
    - name: 调试：检查配置文件
      run: |
        echo "📂 当前目录："
        pwd
        ls -la
        echo ""
        echo "🔍 查找配置文件："
        find . -name "*pr_agent*" -o -name "*secrets*" 2>/dev/null || echo "未找到配置文件"
        
    - name: 运行 PR Agent
      env:
        # OpenAI 兼容 API（移除 api_type）
        OPENAI__KEY: ${{ secrets.ZHIPU_API_KEY }}
        OPENAI__API_BASE: "https://open.bigmodel.cn/api/paas/v4/"
        # ❌ 移除这行：OPENAI__API_TYPE: "azure"
        
        # GitHub Token
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # 模型配置
        CONFIG__MODEL: "glm-4-flash"
        CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
        CONFIG__FALLBACK_MODELS: "[]"
        
        # 禁用额外指令（覆盖可能存在的配置）
        PR_REVIEWER__EXTRA_INSTRUCTIONS: ""
        PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "false"
        PR_REVIEWER__NUM_CODE_SUGGESTIONS: "4"
      run: |
        echo "📋 环境变量检查："
        env | grep -E "CONFIG__|OPENAI__|PR_REVIEWER__" | grep -v "KEY" | sort
        echo ""
        echo "🔍 开始审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review