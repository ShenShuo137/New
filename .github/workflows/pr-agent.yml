name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装 PR Agent
      run: |
        pip install pr-agent
        echo "📦 版本信息："
        pip show openai litellm pr-agent | grep -E "Name:|Version:"
    
    - name: 创建配置文件
      run: |
        cat > .pr_agent.toml << 'EOF'
        [config]
        model = "openai/glm-4-flash"
        custom_model_max_tokens = 128000
        fallback_models = []
        
        [openai]
        api_base = "https://open.bigmodel.cn/api/paas/v4/"
        
        [litellm]
        drop_params = true
        
        [pr_reviewer]
        require_all_thresholds_for_incremental_review = false
        EOF
        
        cat > .secrets.toml << EOF
        [openai]
        api_key = "${{ secrets.ZHIPU_API_KEY }}"
        EOF
        
        echo "📄 配置文件："
        cat .pr_agent.toml
    
    - name: 运行审查
      env:
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 开始审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review