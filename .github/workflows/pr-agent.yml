name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        pip install --upgrade pip
        pip install openai requests
    
    - name: 测试智谱 API（独立测试）
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        python3 << 'EOF'
        import os
        from openai import OpenAI

        print("🔍 测试智谱 API 连接...")
        
        client = OpenAI(
            api_key=os.environ["ZHIPU_API_KEY"],
            base_url="https://open.bigmodel.cn/api/paas/v4/"
        )

        try:
            response = client.chat.completions.create(
                model="glm-4-flash",
                messages=[
                    {"role": "user", "content": "请用一句话介绍你自己"}
                ],
                max_tokens=100
            )
            print("✅ 智谱 API 测试成功！")
            print(f"📝 响应: {response.choices[0].message.content}")
            print(f"📊 Token 使用: {response.usage}")
        except Exception as e:
            print(f"❌ 智谱 API 测试失败: {e}")
            import traceback
            traceback.print_exc()
            exit(1)
        EOF
    
    - name: 安装 PR Agent
      run: |
        pip install pr-agent
        echo "📦 已安装版本："
        pip show pr-agent litellm openai | grep -E "Name:|Version:"
    
    - name: 创建 PR-Agent 配置文件
      run: |
        cat > .pr_agent.toml << 'EOF'
        [config]
        model = "glm-4-flash"
        git_provider = "github"
        
        [litellm]
        drop_params = true
        
        [openai]
        api_type = "openai"
        EOF
        
        echo "📄 配置文件内容："
        cat .pr_agent.toml
    
    - name: 运行 PR Agent
      env:
        OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        OPENAI_API_BASE: "https://open.bigmodel.cn/api/paas/v4/"
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # 强制使用 OpenAI 提供商
        LITELLM_DROP_PARAMS: "true"
      run: |
        echo "🔍 开始审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review