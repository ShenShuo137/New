name: PR Agent - Compatible Versions

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装兼容版本
      run: |
        echo "📦 第1步：先不要安装 pr-agent"
        
        echo "📦 第2步：安装兼容的 openai 和 httpx"
        pip install "openai==1.12.0" "httpx==0.24.1"
        
        echo "📦 第3步：安装 pr-agent（不升级依赖）"
        pip install --no-deps pr-agent
        
        echo "📦 第4步：安装 pr-agent 的其他依赖"
        pip install PyGithub GitPython litellm dynaconf Jinja2 tiktoken
        
        echo "✅ 最终版本："
        pip show openai httpx pr-agent | grep -E "Name:|Version:"
    
    - name: 测试 API
      env:
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        python3 << 'EOF'
        import os
        from openai import OpenAI
        
        print("🔍 测试智谱 API...")
        client = OpenAI(
            api_key=os.environ["ZHIPU_API_KEY"],
            base_url="https://open.bigmodel.cn/api/paas/v4/"
        )
        
        response = client.chat.completions.create(
            model="glm-4-flash",
            messages=[{"role": "user", "content": "Hello"}],
            max_tokens=10
        )
        print(f"✅ 成功！回复: {response.choices[0].message.content}")
        EOF
    
    - name: 创建配置
      run: |
        cat > configuration.toml << 'EOF'
        [config]
        model = "openai/glm-4-flash"
        custom_model_max_tokens = 128000
        fallback_models = []
        
        [litellm]
        drop_params = true
        EOF
        
        cat > .secrets.toml << EOF
        [openai]
        api_key = "${{ secrets.ZHIPU_API_KEY }}"
        api_base = "https://open.bigmodel.cn/api/paas/v4/"
        EOF
    
    - name: 运行 PR Agent
      env:
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review