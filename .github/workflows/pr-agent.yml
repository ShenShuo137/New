name: PR-Agent 智能代码审查

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 运行 PR-Agent
    
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装 PR-Agent
        run: |
          pip install --upgrade pip
          pip install pr-agent
          
      - name: 验证配置
        run: |
          echo "🔍 验证环境变量..."
          echo "API Key 已设置: ${{ secrets.ZHIPU_API_KEY != '' }}"
          echo "GitHub Token 已设置: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "PR URL: ${{ github.event.pull_request.html_url }}"
      
      - name: 运行代码审查
        env:
          # 智谱 GLM 配置
          OPENAI_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI.API_BASE: "https://open.bigmodel.cn/api/paas/v4/"
          OPENAI.API_TYPE: "azure"
          CONFIG.MODEL: "glm-4-flash"
          
          # GitHub 配置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # PR-Agent 配置
          CONFIG.GIT_PROVIDER: "github"
          CONFIG.PUBLISH_OUTPUT: "true"
          CONFIG.PUBLISH_OUTPUT_PROGRESS: "true"
          PR_REVIEWER.AUTO_REVIEW: "true"
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: "4"
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
        run: |
          set -x
          
          echo "📋 开始审查 PR #${{ github.event.pull_request.number }}"
          
          # ✅ 使用官方文档推荐的命令格式
          pr-agent \
            --pr_url="${{ github.event.pull_request.html_url }}" \
            review \
            --output=markdown
          
          echo "✅ 审查完成"