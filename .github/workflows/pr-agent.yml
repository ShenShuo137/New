name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖（指定版本）
      run: |
        pip install --upgrade pip
        pip install "openai>=1.0,<2.0"
        pip install "litellm>=1.30"
        pip install pr-agent
        
        echo "📦 已安装的版本："
        pip show openai litellm pr-agent | grep -E "Name:|Version:"
    
    - name: 运行 PR Agent
      env:
        # 标准 OpenAI 环境变量
        OPENAI_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        OPENAI_API_BASE: "https://open.bigmodel.cn/api/paas/v4/"
        
        # GitHub Token
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # 模型配置（尝试不带前缀）
        CONFIG__MODEL: "glm-4-flash"
        CONFIG__MODEL_TYPE: "openai"
        CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
        CONFIG__FALLBACK_MODELS: "[]"
        
        # 启用调试
        LITELLM_LOG: "INFO"
      run: |
        echo "🔍 开始审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review