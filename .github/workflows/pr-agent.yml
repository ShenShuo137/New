# .github/workflows/pr-agent.yml
name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装 PR Agent
      run: pip install pr-agent
      
    - name: 运行 PR Agent
      env:
        # OpenAI 配置
        OPENAI_KEY: ${{ secrets.ZHIPU_API_KEY }}
        OPENAI.API_BASE: "https://open.bigmodel.cn/api/paas/v4/"
        OPENAI.API_TYPE: "azure"
        
        # GitHub Token
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # ✅ 模型配置
        CONFIG.MODEL: "glm-4-flash"
        CONFIG.GIT_PROVIDER: "github"
        CONFIG.CUSTOM_MODEL_MAX_TOKENS: "128000"  # 关键配置！
        CONFIG.FALLBACK_MODELS: "[]"  # 禁用 fallback
        
        # PR Reviewer 配置
        PR_REVIEWER.AUTO_REVIEW: "true"
        PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
        PR_REVIEWER.NUM_CODE_SUGGESTIONS: "4"
        PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
      run: |
        echo "🔍 审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review