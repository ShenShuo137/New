name: PR Agent - Downgrade OpenAI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装兼容版本
      run: |
        # 先安装旧版 OpenAI SDK（支持 proxies）
        pip install "openai==1.12.0"
        
        # 再安装 pr-agent（不会升级 openai）
        pip install pr-agent --no-deps
        
        # 安装其他依赖
        pip install aiohttp anthropic atlassian-python-api azure-devops azure-identity \
                    boto3 certifi dynaconf fastapi GitPython google-cloud-aiplatform \
                    google-generativeai google-cloud-storage Jinja2 litellm loguru \
                    msrest PyGithub PyYAML python-gitlab retry starlette-context \
                    tiktoken ujson uvicorn tenacity gunicorn pydantic html2text giteapy
        
        echo "📦 关键版本："
        pip show openai litellm pr-agent | grep -E "Name:|Version:"
    
    - name: 创建配置文件
      run: |
        cat > .pr_agent.toml << 'EOF'
        [config]
        model = "openai/glm-4-flash"
        custom_model_max_tokens = 128000
        fallback_models = []
        
        [openai]
        api_base = "https://open.bigmodel.cn/api/paas/v4/"
        
        [litellm]
        drop_params = true
        EOF
        
        cat > .secrets.toml << EOF
        [openai]
        api_key = "${{ secrets.ZHIPU_API_KEY }}"
        EOF
        
        echo "📄 配置文件："
        cat .pr_agent.toml
        
        # 验证配置文件在当前目录
        ls -la .pr_agent.toml .secrets.toml
    
    - name: 运行审查
      env:
        GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 开始审查 PR #${{ github.event.pull_request.number }}"
        pr-agent --pr_url="${{ github.event.pull_request.html_url }}" review